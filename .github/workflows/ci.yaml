name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # O build já faz o restore. Aponta para o .csproj porque não há .sln.
      - run: dotnet build BarbeariaAPI/BarbeariaAPI.csproj -c Release